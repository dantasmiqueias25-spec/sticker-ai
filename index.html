<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sticker AI Pro</title>

<style>
body {
  background: #0f0f0f;
  color: #fff;
  font-family: sans-serif;
  text-align: center;
  margin: 0;
}

h1 {
  margin-top: 20px;
}

.container {
  padding: 15px;
}

input, select, button {
  width: 90%;
  margin: 8px;
  padding: 12px;
  border-radius: 12px;
  border: none;
}

button {
  background: linear-gradient(45deg, #00ff99, #00ccff);
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.styles button {
  width: 30%;
  font-size: 12px;
}

.active {
  background: #00ff99 !important;
  color: #000;
}

img {
  margin-top: 15px;
  max-width: 90%;
  border-radius: 12px;
}

#status {
  margin-top: 10px;
}

#history img {
  width: 70px;
  margin: 5px;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>✨ Sticker AI PRO</h1>

<div class="container">

<input id="prompt" placeholder="Ex: cachorro astronauta fofo">

<div class="styles">
  <button onclick="setStyle('sticker', this)" class="active">🟢 Figurinha</button>
  <button onclick="setStyle('emoji', this)">😀 Emoji</button>
  <button onclick="setStyle('anime', this)">🎌 Anime</button>
  <button onclick="setStyle('realista', this)">📸 Realista</button>
  <button onclick="setStyle('pixel', this)">👾 Pixel</button>
  <button onclick="setStyle('3d', this)">🧊 3D</button>
  <button onclick="setStyle('neon', this)">🌆 Neon</button>
</div>

<input id="apiKey" placeholder="hf_...">

<button onclick="generate()">🚀 Gerar</button>

<p id="status"></p>

<img id="img">

<br>
<button onclick="downloadImage()">⬇️ Baixar</button>
<button onclick="clearHistory()">🗑 Limpar</button>

<div id="history">
  <h3>🕘 Histórico</h3>
</div>

</div>

<script>
let style = 'sticker';

function setStyle(s, el) {
  style = s;
  document.querySelectorAll('.styles button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

// PROMPT INTELIGENTE
function buildPrompt(base) {
  const styles = {
    sticker: "cute sticker, white background, whatsapp style, high quality",
    emoji: "emoji style, simple, rounded, clean, vector",
    anime: "anime style, vibrant colors, detailed, studio ghibli",
    realista: "photorealistic, ultra realistic, 4k, high detail",
    pixel: "pixel art, 8-bit, retro game style",
    "3d": "3D render, blender style, soft lighting",
    neon: "cyberpunk neon, glowing lights, dark background"
  };

  return base + ", " + styles[style];
}

async function generate() {
  const basePrompt = document.getElementById('prompt').value;
  const apiKey = document.getElementById('apiKey').value;

  if (!basePrompt || !apiKey) {
    alert('Preencha tudo');
    return;
  }

  const prompt = buildPrompt(basePrompt);

  document.getElementById('status').innerText = 'Gerando... ⏳';
  document.getElementById('img').src = '';

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: prompt,
        model: "runwayml/stable-diffusion-v1-5",
        apiKey: apiKey
      })
    });

    if (!res.ok) throw new Error(await res.text());

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    document.getElementById('img').src = url;
    document.getElementById('status').innerText = '✅ Pronto!';

    save(url);

  } catch (e) {
    document.getElementById('status').innerText = '❌ ' + e.message;
  }
}

// HISTÓRICO
function save(url) {
  let list = JSON.parse(localStorage.getItem('imgs')) || [];
  list.unshift(url);
  list = list.slice(0, 20);
  localStorage.setItem('imgs', JSON.stringify(list));
  renderHistory();
}

function renderHistory() {
  const div = document.getElementById('history');
  div.innerHTML = "<h3>🕘 Histórico</h3>";

  const list = JSON.parse(localStorage.getItem('imgs')) || [];

  list.forEach(url => {
    const img = document.createElement('img');
    img.src = url;
    img.onclick = () => document.getElementById('img').src = url;
    div.appendChild(img);
  });
}

// DOWNLOAD
function downloadImage() {
  const img = document.getElementById('img');
  if (!img.src) return alert('Nenhuma imagem');

  const a = document.createElement('a');
  a.href = img.src;
  a.download = 'sticker.png';
  a.click();
}

// LIMPAR
function clearHistory() {
  localStorage.removeItem('imgs');
  renderHistory();
}

window.onload = renderHistory;
</script>

</body>
</html>
