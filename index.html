<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sticker AI</title>

<style>
:root {
  --primary: #00ff88;
  --bg: #0d0d0d;
  --card: #1a1a1a;
  --text: #eee;
}

body {
  margin: 0;
  font-family: -apple-system, sans-serif;
  background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
  color: var(--text);
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 0 20px #00ff8830;
}

input, select {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #2a2a2a;
  color: white;
  font-size: 15px;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: var(--primary);
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  color: black;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.03);
  background: #00cc77;
}

#status {
  text-align: center;
  margin-top: 15px;
  color: #66ffaa;
}

.image-box {
  margin-top: 20px;
  text-align: center;
}

.image-box img {
  width: 100%;
  border-radius: 14px;
  box-shadow: 0 0 15px #00ff8870;
}

.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: #777;
}
</style>
</head>

<body>

<div class="container">

  <h1>✨ Sticker AI</h1>

  <div class="card">

    <input id="prompt" placeholder="Ex: cachorro astronauta fofo">

    <select id="model">
      <option value="stabilityai/stable-diffusion-xl-base-1.0">SDXL (melhor)</option>
    </select>

    <select id="style">
      <option value="sticker">🟢 Figurinha</option>
      <option value="emoji">😀 Emoji</option>
      <option value="anime">👾 Anime</option>
      <option value="pixel">🟣 Pixel</option>
      <option value="3d">🌀 3D</option>
      <option value="neon">🌆 Neon</option>
    </select>

    <input id="apiKey" placeholder="hf_...">

    <button onclick="generate()">Gerar Figurinha</button>

    <p id="status"></p>

  </div>

  <div class="image-box">
    <img id="img">
  </div>

  <div class="footer">
    Gerador de Figurinhas com IA 🚀
  </div>

</div>

<script>
function buildPrompt(text, style) {
  const styles = {
    sticker: "whatsapp sticker, white outline, centered",
    emoji: "emoji style, flat, vibrant, icon",
    anime: "anime style, detailed, vibrant",
    pixel: "pixel art, 16-bit",
    "3d": "3D render, realistic lighting",
    neon: "neon glow, cyberpunk"
  };

  return `${text}, ${styles[style]}, high quality, centered`;
}

async function generate() {
  const prompt = document.getElementById('prompt').value;
  const model = document.getElementById('model').value;
  const style = document.getElementById('style').value;
  const apiKey = document.getElementById('apiKey').value;

  const status = document.getElementById('status');
  const img = document.getElementById('img');

  if (!prompt || !apiKey) {
    alert('Preencha tudo');
    return;
  }

  const finalPrompt = buildPrompt(prompt, style);

  status.textContent = 'Gerando... ⏳';
  img.src = '';

  try {
    const response = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: finalPrompt,
        model: model,
        apiKey: apiKey
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.details || err.error);
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    img.src = url;
    status.textContent = '✅ Pronto!';

  } catch (err) {
    status.textContent = '❌ ' + err.message;
  }
}
</script>

</body>
</html>
